<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP Interface</title>
<style>
body {
 background:#101010;
 color:white;
 font-family:Arial;
 text-align:center;
}
h1 {color:#00ff88;}
.panel {
 background:#202020;
 margin:15px;
 padding:20px;
 border-radius:15px;
}
button {
 background:#00cc77;
 color:black;
 border:0;
 padding:13px;
 margin:7px;
 border-radius:8px;
 font-weight:bold;
}
</style>
</head>
<body>
<h1>ESP INTERFACE</h1>
<div class="panel">
<h2>MAIN MENU</h2>
<button onclick="toggle(this)">ESP: OFF</button>
<button onclick="toggle(this)">LINES: OFF</button>
<button onclick="toggle(this)">BOX: OFF</button>
<button onclick="toggle(this)">SETTINGS</button>
</div>
<script>
function toggle(btn) {
 if(btn.innerText.includes("SETTINGS")) {
 alert("Настройки интерфейса");
 return;
 }
 btn.innerText = btn.innerText.replace("OFF","ON").replace("ON","OFF");
}
</script>
</body>
</html>
