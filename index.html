
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP Android</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px;
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 420px;
  margin: 35px auto;
  padding: 22px;
  background: #111b2d;
  border: 1px solid #00eaff;
  border-radius: 20px;
  box-shadow: 0 0 20px #00eaff44;
}

h1 {
  color: #00eaff;
  text-align: center;
}

p {
  text-align: center;
  color: #9daec4;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px;
  margin-top: 14px;
  background: #1c2940;
  border-radius: 12px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 17px;
  background: #34445d;
  color: white;
  font-weight: bold;
}

button.active {
  background: #00c991;
  color: #061b17;
}

#settings {
  display: none;
  margin-top: 18px;
  padding: 15px;
  background: #1c2940;
  border-radius: 12px;
}

.footer {
  margin-top: 25px;
  text-align: center;
  font-size: 12px;
  color: #71839c;
}
</style>
</head>

<body>
<div class="container">
  <h1>ESP ANDROID</h1>
  <p>CONTROL PANEL</p>

  <div class="item">
    <b>ESP</b>
    <button onclick="toggle(this)">OFF</button>
  </div>

  <div class="item">
    <b>BOX</b>
    <button onclick="toggle(this)">OFF</button>
  </div>

  <div class="item">
    <b>SETTINGS</b>
    <button onclick="settings()">OPEN</button>
  </div>

  <div id="settings">
    <h3>Настройки интерфейса</h3>
    <p>Демонстрационная панель</p>
    <button onclick="settings()">CLOSE</button>
  </div>

  <div class="footer">
    ESP ANDROID v1.0
  </div>
</div>

<script>
function toggle(button) {
  button.classList.toggle("active");
  button.textContent =
    button.classList.contains("active") ? "ON" : "OFF";
}

function settings() {
  const panel = document.getElementById("settings");
  panel.style.display =
    panel.style.display === "block" ? "none" : "block";
}
</script>
</body>
</html>
